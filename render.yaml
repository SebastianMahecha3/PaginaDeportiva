# Render Blueprint: crea el servicio web gratuito con Docker.
# Los valores con "sync: false" los escribes TÚ en el panel de Render (no se guardan en Git).
services:
  - type: web
    name: liga-not-fifa-2026
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: TZ
        value: America/Bogota
      - key: DATABASE_URL          # formato JDBC: jdbc:postgresql://HOST:5432/BD?sslmode=require
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD        # contraseña principal del administrador Egoisu
        sync: false
      - key: ADMIN_PASSWORD_RESPALDO
        sync: false
