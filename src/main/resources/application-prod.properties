# ===== Perfil de PRODUCCIÓN (se activa con SPRING_PROFILES_ACTIVE=prod) =====
# Los hostings gratuitos asignan el puerto en la variable PORT.
server.port=${PORT:8080}
# Detrás del proxy del hosting (HTTPS): respeta X-Forwarded-* para redirecciones y cookies seguras.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.shutdown=graceful

# Plantillas en caché y logs sobrios
spring.thymeleaf.cache=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO

# Memoria limitada (planes gratuitos ~512 MB): pocas conexiones a la BD en la nube
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
