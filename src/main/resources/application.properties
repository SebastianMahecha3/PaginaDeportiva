spring.application.name=liga-not-fifa-2026

# --- Base de datos (usa la variable de entorno si existe; si no, la configuración local) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/liga_not_fifa_2026}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Cacajulk3}

# --- Hibernate ---
# ddl-auto=update: crea las tablas que faltan y agrega columnas nuevas, pero NUNCA borra
# tablas, columnas ni datos existentes. (create / create-drop sí borrarían todo: no usarlos.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Permite que Thymeleaf lea relaciones LAZY (ej. selecciones de una apuesta) al renderizar.
spring.jpa.open-in-view=true

# --- Thymeleaf / errores ---
spring.thymeleaf.cache=false
server.error.include-stacktrace=never
server.error.include-message=never

# --- Administrador inicial (usuario Egoisu) ---
# Si ADMIN_PASSWORD no está definida, se genera una contraseña aleatoria y se muestra UNA vez en consola.
app.admin.password=${ADMIN_PASSWORD:}

# --- Reglas de apuestas (configurables) ---
# Comisión sobre el dinero apostado: ganancia = (apuesta - apuesta*comision) * cuota
apuestas.comision=0.05
# Líneas ofrecidas (PROPUESTA: pendiente de aprobación junto con la fórmula de cuotas)
apuestas.lineas-goles=1.5,2.5,3.5
apuestas.lineas-tiros=6.5,8.5,10.5
apuestas.lineas-corners=2.5,3.5,4.5
# Parley: cuota combinada = SUMA de las cuotas de las selecciones, multiplicada por (1 + bonus).
# Bonus = (selecciones - 1) * parley-bonus-por-seleccion. Con 0.00 la cuota del parley es solo la suma.
# 0.00 = sin bonus (se puede activar sin tocar el código, ej. 0.02 = +2% por selección extra).
apuestas.parley-maximo-selecciones=10
apuestas.parley-bonus-por-seleccion=0.00

# --- Motor de cuotas (fórmula aprobada) ---
# Margen de la casa sobre la probabilidad (0.08 = 8%). Cuota = 1 / (p * (1 + margen)), redondeada a 2 decimales.
cuotas.margen=0.05
# Suavizado hacia el promedio de la liga: peso del historial = n / (n + k)
cuotas.suavizado-k=5
cuotas.cuota-minima=1.10
cuotas.cuota-maxima=10.00
# Promedios de la liga mientras no hay partidos jugados
cuotas.goles-local-liga=1.5
cuotas.goles-visitante-liga=1.2
cuotas.tiros-liga=8
cuotas.corners-liga=4

# --- Contraseña de respaldo del administrador Egoisu ---
# El administrador puede entrar con ADMIN_PASSWORD (o la aleatoria) Y con esta. Vacía = sin respaldo.
# En producción defínela SIEMPRE como variable de entorno ADMIN_PASSWORD_RESPALDO en el panel del hosting.
app.admin.password-respaldo=${ADMIN_PASSWORD_RESPALDO:Cacajulk3}