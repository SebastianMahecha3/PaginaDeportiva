<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: cabecera('Iniciar sesión')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('login')}"></header>
<main class="contenedor">
  <div class="tarjeta form-caja">
    <h1>Iniciar sesión</h1>
    <div th:if="${param.error}" class="mensaje error" role="alert">Usuario o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="mensaje info" role="status">Cerraste sesión correctamente.</div>
    <div th:if="${param.registrado}" class="mensaje ok" role="status">Registro exitoso. Ya puedes iniciar sesión.</div>
    <form class="formulario" th:action="@{/login}" method="post">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" required autofocus autocomplete="username">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <p><button class="btn" type="submit">Entrar</button></p>
    </form>
    <p class="suave">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
